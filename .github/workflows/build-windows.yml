name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri executable and installers
        run: npm run tauri build

      - name: Upload Windows build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: taskbar-lyrics-player-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/taskbar-lyrics-player.exe
            src-tauri/target/release/bundle/

      - name: Publish GitHub Release assets
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $repository = $env:GITHUB_REPOSITORY

          gh release view $tag --repo $repository *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo $repository `
              --title "LyricRail $tag" `
              --notes "Download the Windows executable or installer below." `
              --verify-tag
          }

          $assets = @(
            (Resolve-Path "src-tauri/target/release/taskbar-lyrics-player.exe").Path,
            (Get-ChildItem -File "src-tauri/target/release/bundle/msi/*.msi").FullName,
            (Get-ChildItem -File "src-tauri/target/release/bundle/nsis/*.exe").FullName
          )
          gh release upload $tag $assets --repo $repository --clobber
